<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="1800" height="1200" viewBox="0 0 1800 1200"
     role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Architecture Diagram</title>
  <desc id="diagram-desc">Replace this description with the diagram viewpoint.</desc>
  <sodipodi:namedview id="namedview" pagecolor="#ffffff" bordercolor="#666666"
      borderopacity="1" inkscape:pageopacity="1" showgrid="false"/>
  <defs>
    <marker id="arrow" viewBox="0 0 16 12" refX="15" refY="6"
        markerWidth="16" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,0 L 16,6 L 0,12 L 4.5,6 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-reverse" viewBox="0 0 16 12" refX="1" refY="6"
        markerWidth="16" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 16,0 L 0,6 L 16,12 L 11.5,6 Z" fill="#000000"/>
    </marker>
    <style><![CDATA[
      text { fill:#000000; font-family:"Noto Serif CJK SC","Noto Serif",serif; font-weight:400; font-style:normal; }
      .page { fill:#ffffff; }
      .title { font-size:48px; }
      .panel { fill:#f3f3f3; stroke:#000000; stroke-width:4; }
      .panel-label { font-size:32px; }
      .node { fill:#e5e5e5; stroke:#000000; stroke-width:3; }
      .node.optional { stroke-dasharray:10 8; }
      .node-label { font-size:24px; text-anchor:middle; dominant-baseline:middle; }
      .node-meta { font-size:17px; text-anchor:middle; dominant-baseline:middle; }
      .store { fill:#ffffff; stroke:#000000; stroke-width:3; }
      .edge { fill:none; stroke:#000000; stroke-width:2.5; stroke-linecap:butt; stroke-linejoin:miter; marker-end:url(#arrow); }
      .edge.optional { stroke-dasharray:10 8; }
      .edge.bidirectional { marker-start:url(#arrow-reverse); }
      .edge-label-bg { fill:#ffffff; }
      .edge-label { font-size:18px; text-anchor:middle; dominant-baseline:middle; }
      .annotation { font-size:18px; }
      .legend { font-size:16px; }
      .code { font-family:"Noto Sans Mono CJK SC","Noto Sans Mono",monospace; }
    ]]></style>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="Canvas" id="canvas">
    <rect class="page" x="0" y="0" width="1800" height="1200"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Panels" id="panels"/>
  <g inkscape:groupmode="layer" inkscape:label="Connectors" id="connectors"/>
  <g inkscape:groupmode="layer" inkscape:label="Nodes" id="nodes"/>
  <g inkscape:groupmode="layer" inkscape:label="Labels" id="labels">
    <text class="title" x="60" y="72">Architecture Diagram</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="1920" height="1080" viewBox="0 0 1920 1080"
     role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Business Flow</title>
  <desc id="diagram-desc">Replace this description with the business-visible process.</desc>
  <sodipodi:namedview id="namedview" pagecolor="#ffffff" bordercolor="#666666"
      borderopacity="1" inkscape:pageopacity="1" showgrid="false"/>
  <defs>
    <marker id="arrow" viewBox="0 0 18 14" refX="17" refY="7"
        markerWidth="18" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,0 L 18,7 L 0,14 L 5,7 Z" fill="#000000"/>
    </marker>
    <marker id="arrow-reverse" viewBox="0 0 18 14" refX="1" refY="7"
        markerWidth="18" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 18,0 L 0,7 L 18,14 L 13,7 Z" fill="#000000"/>
    </marker>
    <style><![CDATA[
      text { fill:#000000; font-family:"Noto Serif CJK SC","Noto Serif",serif; font-weight:400; font-style:normal; }
      .page { fill:#ffffff; }
      .title { font-size:48px; }
      .actor { fill:#e7e7e7; stroke:#000000; stroke-width:4; }
      .actor.optional { stroke-dasharray:10 8; }
      .actor-label { font-size:31px; text-anchor:middle; dominant-baseline:middle; }
      .actor-meta { font-size:18px; text-anchor:middle; dominant-baseline:middle; }
      .gate { fill:#f3f3f3; stroke:#000000; stroke-width:4; }
      .terminal { fill:#ffffff; stroke:#000000; stroke-width:3; }
      .edge { fill:none; stroke:#000000; stroke-width:3; stroke-linecap:butt; stroke-linejoin:miter; marker-end:url(#arrow); }
      .edge.optional { stroke-dasharray:10 8; }
      .edge.bidirectional { marker-start:url(#arrow-reverse); }
      .edge-label-bg { fill:#ffffff; }
      .edge-label { font-size:20px; text-anchor:middle; dominant-baseline:middle; }
      .annotation { font-size:18px; }
      .legend { font-size:16px; }
    ]]></style>
  </defs>
  <g inkscape:groupmode="layer" inkscape:label="Canvas" id="canvas">
    <rect class="page" x="0" y="0" width="1920" height="1080"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="Panels" id="panels"/>
  <g inkscape:groupmode="layer" inkscape:label="Connectors" id="connectors"/>
  <g inkscape:groupmode="layer" inkscape:label="Nodes" id="nodes"/>
  <g inkscape:groupmode="layer" inkscape:label="Labels" id="labels">
    <text class="title" x="60" y="72">Business Flow</text>
  </g>
</svg>

name: validate

on:
  push:
  pull_request:

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills
        run: python3 scripts/validate.py
      - name: Test validator
        run: python3 scripts/test_validate.py
      - name: Check argument-review structure
        run: python3 scripts/test_argument_review.py
      - name: Check SVG fixture structure
        run: python3 skills/svg-web-delivery/scripts/check-fixture.py --self-test
